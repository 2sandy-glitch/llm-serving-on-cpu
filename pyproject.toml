[project]
name = "llm-serving-on-cpu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

# Install the shared gpt2lab package (editable) so every experiment folder can import it.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpt2lab"]

[tool.pytest.ini_options]
# Each experiment has its own tests/ folder; importlib mode lets test files share names safely.
addopts = "--import-mode=importlib"
